# turzx-nvtop configuration. Copy to ~/.config/turzx-nvtop/config.ini (or /etc/turzx-nvtop/config.ini).
# Every key is optional; the values below are the defaults.

[nvstats]
url = http://127.0.0.1:8039        # nvstats-service HTTP API (install it with ./install.sh --http there)
token =                            # NVSTATS_TOKEN if the service requires one

[display]
port = auto                        # auto, or e.g. /dev/turzx-lcd
rotation = 0                       # 0 or 180: use 180 if the screen is upside down in your mounting
brightness = 70                    # percent
settle_seconds = 2                 # wait after (re)plugging before drawing; the first frames can be dropped
sync_on_start = yes
full_refresh_seconds = 600         # periodic full repaint to heal glitches (0 = never)
screen_off_on_exit = no

[screens]
order = graph, gauges              # any of: graph, gauges, llm
graph_seconds = 15
gauges_seconds = 5
llm_seconds = 5

[graph]
px_per_second = 2                  # scroll speed: 2 px/s = ~3.9 minutes of history, whatever the sample rate
refresh_seconds = 0.5              # graph redraw interval; lower = smoother but the panel's top-to-bottom repaint becomes visible
smooth = yes                       # scroll continuously between the 1 Hz samples

[gauges]
refresh_seconds = 1

[llm]
refresh_seconds = 2

[limits]
power_max_w = 120                  # 100% of the power gauge (the GPU's own cap is used if it reports one)
temp_max_c = 100
mem_label = GTT                    # GTT on an APU, VRAM on a discrete card
