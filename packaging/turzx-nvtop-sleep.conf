# Installed by turzx-nvtop's install.sh (user-service mode) as
#   /etc/systemd/system/systemd-{suspend,hibernate,hybrid-sleep,suspend-then-hibernate}.service.d/turzx-nvtop.conf
#
# By default systemd freezes user.slice *before* it runs the /usr/lib/systemd/system-sleep hooks, so the
# turzx-nvtop daemon (a user service) could never act on the hook's "blank the display" signal. This keeps
# user processes running until the hook has finished. Remove these drop-ins to restore the default
# (the display then stays lit while the host sleeps).
[Service]
Environment=SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=0
